name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bantr
          POSTGRES_PASSWORD: bantr
          POSTGRES_DB: bantr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bantr -d bantr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bantr:bantr@localhost:5432/bantr_test
      TEST_DATABASE_URL: postgresql+psycopg://bantr:bantr@localhost:5432/bantr_test
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_REAL_REDIS: "1"
      SECRET_KEY: ci-only-secret
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-root --no-interaction
      - name: Lint
        run: poetry run ruff check .
      - name: Format check
        run: poetry run ruff format --check .
      - name: Migrations apply to an empty database and match the models
        run: |
          poetry run flask --app wsgi db upgrade
          poetry run flask --app wsgi db check
      - name: Tests
        run: poetry run pytest -q --basetemp="$RUNNER_TEMP/pytest" --cov=app --cov-report=term-missing --cov-report=xml
      - name: Keep server logs when a run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: ${{ runner.temp }}/pytest/**/server-*.log
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml