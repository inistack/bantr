[project]
name = "bantr"
version = "0.0.1"
description = "multi-tenant chat app powered by Flask"
authors = [
    {name = "inistack"}
]
requires-python = ">=3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "authlib (>=1.8.0,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.10,<0.17.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]