upstream bantr_api {
    zone bantr_api 64k;
    server api1:5000;
    server api2:5000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format bantr '$remote_addr "$request" $status rid=$request_id upstream=$upstream_addr request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log bantr;

    # Metrics are for the monitoring system inside the network, not the public.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://bantr_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}