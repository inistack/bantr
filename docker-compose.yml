name: bantr

x-app-env: &app-env
  APP_ENV: production
  LOG_FORMAT: json
  PROXY_HOPS: "1"
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.compose}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.compose}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env.compose}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env.compose}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-1}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-400}
  MESSAGE_RATE_LIMIT: ${MESSAGE_RATE_LIMIT:-5 per second;60 per minute}
  SOCKETIO_USE_QUEUE: ${SOCKETIO_USE_QUEUE:-1}

x-api: &api
  build: ./backend
  environment: *app-env
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"   # local development only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    environment: *app-env
    command: ["flask", "--app", "wsgi", "db", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api1:
    <<: *api

  api2:
    <<: *api

  proxy:
    image: nginx:stable-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api1:
        condition: service_healthy
        restart: true
      api2:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  pgdata: